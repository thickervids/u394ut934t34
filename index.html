<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Landing Page</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#111;color:#fff}
.page{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(135deg,#151515,#303030)}
.bg{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.68)),radial-gradient(circle at 50% 25%,#555,#222 48%,#111)}
.wrap{position:relative;z-index:2;width:100%;max-width:720px;margin:auto;padding:35px 16px 50px}
header{text-align:center}
.logo{width:82px;height:82px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;background:#333;border:2px solid #fff;font-weight:bold}
h1{font-size:24px;margin:14px 0 6px}
.sub{font-size:14px;color:#ccc;margin-bottom:25px}
.video-box{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.45)}
.video-box video{width:100%;height:100%;display:block;object-fit:cover}
.buttons{margin-top:22px}
.btn{display:block;text-decoration:none;background:#fff;color:#111;text-align:center;font-weight:700;padding:17px;border-radius:35px;margin:13px 0}
footer{text-align:center;color:#999;font-size:12px;margin-top:28px}
@media(max-width:480px){
.wrap{padding:25px 12px 40px}
h1{font-size:21px}
.video-box{border-radius:10px}
.btn{padding:15px}
}
</style>
</head>
<body>
<div class="page">
<div class="bg"></div>
<div class="wrap">
<header>
<div class="logo">LOGO</div>
<h1>Your Landing Page</h1>
<div class="sub">Replace this text with your own description.</div>
</header>

<div class="video-box">
<video controls playsinline preload="metadata">
<source src="video.mp4" type="video/mp4">
Your browser does not support HTML5 video.
</video>
</div>

<div class="buttons">
<a class="btn" href="#">CONTINUE</a>
<a class="btn" href="#">LEARN MORE</a>
</div>

<footer>© 2026 Your Website</footer>
</div>
</div>
</body>
</html>
