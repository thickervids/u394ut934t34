<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your landing page">
<title>I hope you all like it!</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --font-family:'Poppins',Arial,sans-serif;
  --color-text:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:var(--font-family)}
body{overflow-x:hidden;background:#111}

.page-container{
  position:relative;
  width:100%;
  min-height:100vh;
  overflow:hidden;
  color:#fff;
  background:#111;
}

/* Background video: full screen + blur, matching the original theme */
.page-theme-content{
  position:fixed;
  z-index:0;
  top:50%;
  left:50%;
  width:100vw;
  height:100vh;
  min-width:100%;
  min-height:100%;
  object-fit:cover;
  transform:translate(-50%,-50%) scale(1.08);
  filter:blur(14px);
  opacity:.78;
  pointer-events:none;
}

/* Dark layer makes the content readable */
.page-container::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(0,0,0,.42);
  pointer-events:none;
}

.page-wrap{
  position:relative;
  z-index:2;
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:0 auto;
}

.content{
  padding:0 20px 100px;
  min-height:calc(100vh - 10rem);
}

.page-header{
  text-align:center;
  padding-top:1px;
}

.profile-pic{
  display:block;
  width:100px;
  height:100px;
  margin:0 auto;
  border-radius:10000px;
  border:2px solid #fff;
  object-fit:cover;
  margin-top:65px;
}

.header-title{
  color:#fff;
  margin-top:16px;
  padding:10px;
  font-size:21px;
  font-weight:600;
}

.header-subtitle{
  margin-top:8px;
  color:#fff;
  font-size:16px;
  opacity:.7;
  padding:0 40px;
}

.user-blocks{
  margin-top:8px;
}

.user-block{
  margin-top:2rem;
  margin-bottom:2rem;
}

.user-block a{
  display:block;
  color:#000;
  text-decoration:none;
}

.content-btn{
  position:relative;
  display:flex;
  width:100%;
  min-height:60px;
  align-items:center;
  justify-content:center;
  padding:8px;
  margin:16px 0;
  border-radius:36px;
  background:#fff;
  color:#000;
  box-shadow:none;
  transition:transform .2s ease,opacity .2s ease;
}

.content-btn:hover{
  transform:translateY(-2px);
  opacity:.95;
}

.text-content{
  width:100%;
  text-align:center;
  margin:16px;
  font-size:18px;
  font-weight:700;
}

/* Animated border like the original */
.animated-border::before,
.animated-border::after{
  content:"";
  position:absolute;
  top:-10px;
  left:-10px;
  right:-10px;
  bottom:-10px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:36px;
  pointer-events:none;
  animation:clippath 3s infinite linear;
}
.animated-border::after{
  animation-delay:-1.5s;
}

@keyframes clippath{
  0%,100%{clip-path:inset(0 0 96% 0 round 36px)}
  25%{clip-path:inset(0 96% 0 0 round 36px)}
  50%{clip-path:inset(96% 0 0 0 round 36px)}
  75%{clip-path:inset(0 0 0 96% round 36px)}
}

footer{
  position:relative;
  z-index:2;
  width:100%;
  text-align:center;
  padding:20px;
  color:rgba(255,255,255,.55);
  font-size:11px;
}

@media(max-width:500px){
  .page-theme-content{
    width:100vw;
    height:100vh;
    transform:translate(-50%,-50%) scale(1.12);
    filter:blur(12px);
  }
  .content{
    padding-left:20px;
    padding-right:20px;
  }
  .profile-pic{
    width:100px;
    height:100px;
    margin-top:65px;
  }
  .header-title{font-size:21px}
  .text-content{font-size:18px}
}
</style>
</head>

<body>
<div class="page-container">

  <video class="page-theme-content" autoplay muted loop playsinline preload="auto">
    <source src="background-video.mp4" type="video/mp4">
  </video>

  <div class="page-wrap">
    <div class="content">

      <header class="page-header">

        <div class="header-title">
          Press Continue to watch the video.
        </div>

        <div class="header-subtitle">
          Press Continue to watch the video.
        </div>
      </header>

      <section class="user-blocks">

        <div class="user-block">
          <a href="#" rel="nofollow noopener noreferrer">
            <div class="content-btn animated-border">
              <div class="text-content">PLAY VIDEO</div>
            </div>
          </a>
        </div>

        <div class="user-block">
          <a href="#" rel="nofollow noopener noreferrer">
            <div class="content-btn">
              <div class="text-content">ALTERNATIVE</div>
            </div>
          </a>
        </div>

      </section>
    </div>

    <footer>© 2026 Your Website</footer>
  </div>
</div>
</body>
</html>
