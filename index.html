<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your landing page">
<title>I hope you all like it!</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --font-family:'Poppins',Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:var(--font-family);
}

body{
  overflow-x:hidden;
  background:#111;
}

.page-container{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100svh;
  overflow:hidden;
  color:#fff;
  background:#111;
}

/* BACKGROUND VIDEO */
.page-theme-content{
  position:fixed;
  z-index:0;
  top:50%;
  left:50%;
  width:100vw;
  height:100vh;
  min-width:100%;
  min-height:100%;
  object-fit:cover;
  transform:translate(-50%,-50%) scale(1.08);
  filter:blur(14px);
  opacity:.78;
  pointer-events:none;
}

/* DARK OVERLAY */
.page-container::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(0,0,0,.42);
  pointer-events:none;
}

/* CENTER CONTENT */
.page-wrap{
  position:relative;
  z-index:2;
  width:100%;
  max-width:720px;
  min-height:100vh;
  min-height:100svh;
  margin:0 auto;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.content{
  width:100%;
  padding:20px;
}

.page-header{
  text-align:center;
  padding:0;
}

.header-subtitle{
  margin:0 0 10px;
  color:#fff;
  font-size:16px;
  font-weight:500;
  opacity:.85;
  padding:0 20px;
  line-height:1.5;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}

/* BUTTON */
.user-block{
  margin:12px 0;
}

.user-block a{
  display:block;
  color:#000;
  text-decoration:none;
}

.content-btn{
  position:relative;
  display:flex;
  width:100%;
  min-height:58px;
  align-items:center;
  justify-content:center;
  padding:8px;
  margin:12px 0;

  border-radius:32px;
  background:#fff;
  color:#000;

  box-shadow:0 8px 25px rgba(0,0,0,.25);

  transition:
    transform .2s ease,
    opacity .2s ease;
}

.content-btn:hover{
  transform:translateY(-2px);
  opacity:.95;
}

.content-btn:active{
  transform:scale(.98);
}

.text-content{
  width:100%;
  text-align:center;
  margin:12px;
  font-size:17px;
  font-weight:700;
}

/* FOOTER */
footer{
  position:absolute;
  bottom:5px;
  left:0;
  z-index:2;

  width:100%;
  text-align:center;

  padding:8px;
  color:rgba(255,255,255,.55);
  font-size:11px;
}

/* MOBILE */
@media(max-width:500px){

  .page-container{
    min-height:100svh;
  }

  .page-theme-content{
    width:100vw;
    height:100svh;
    transform:translate(-50%,-50%) scale(1.12);
    filter:blur(12px);
  }

  .page-wrap{
    min-height:100svh;
    justify-content:center;
  }

  .content{
    padding:20px;
  }

  .header-subtitle{
    font-size:15px;
    padding:0 15px;
  }

  .content-btn{
    min-height:58px;
    margin:12px 0;
  }

  .text-content{
    font-size:17px;
  }
}

/* SMALL PHONE */
@media(max-height:650px){

  .header-subtitle{
    font-size:14px;
  }

  .content-btn{
    min-height:52px;
    margin:9px 0;
  }

  .text-content{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="page-container">

  <!-- BACKGROUND VIDEO -->
  <video
    id="backgroundVideo"
    class="page-theme-content"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
    webkit-playsinline>
  </video>

  <div class="page-wrap">

    <div class="content">

      <header class="page-header">
        <div class="header-subtitle">
          Press Continue to watch the video.
        </div>
      </header>

      <!-- PLAY VIDEO -->
      <div class="user-block">
        <a href="#" rel="nofollow noopener noreferrer">
          <div class="content-btn">
            <div class="text-content">
              PLAY VIDEO
            </div>
          </div>
        </a>
      </div>

      <!-- ALTERNATIVE -->
      <div class="user-block">
        <a href="#" rel="nofollow noopener noreferrer">
          <div class="content-btn">
            <div class="text-content">
              ALTERNATIVE
            </div>
          </div>
        </a>
      </div>

    </div>

    <footer>
      © 2026 Your Website
    </footer>

  </div>

</div>

<script>
/* ==================================================
   GANTI URL VIDEO DI SINI
   ================================================== */

const BACKGROUND_VIDEO_URL =
  "https://cdn.videy.co/8X1yueep1.mp4";


/* ==================================================
   LOAD VIDEO
   ================================================== */

const backgroundVideo =
  document.getElementById("backgroundVideo");

function loadBackgroundVideo(){

  backgroundVideo.src = BACKGROUND_VIDEO_URL;

  backgroundVideo.load();

  const playVideo = () => {
    backgroundVideo.play().catch(() => {
      console.log("Autoplay tidak diizinkan oleh browser.");
    });
  };

  if(backgroundVideo.readyState >= 2){
    playVideo();
  }else{
    backgroundVideo.addEventListener(
      "loadeddata",
      playVideo,
      {once:true}
    );
  }
}


/* ==================================================
   VIDEO ERROR CHECK
   ================================================== */

backgroundVideo.addEventListener("error", function(){

  console.log(
    "Background video gagal dimuat.",
    backgroundVideo.error
  );

});


/* START */
loadBackgroundVideo();
</script>

</body>
</html>
