<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your landing page">
<title>I hope you all like it!</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --font-family:'Poppins',Arial,sans-serif;
  --color-text:#fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:var(--font-family);
}

body{
  overflow-x:hidden;
  background:#111;
}

/* MAIN CONTAINER */
.page-container{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100svh;
  overflow:hidden;
  color:#fff;
  background:#111;
}

/* BLURRED BACKGROUND VIDEO */
.page-theme-content{
  position:fixed;
  z-index:0;
  top:50%;
  left:50%;
  width:100vw;
  height:100vh;
  min-width:100%;
  min-height:100%;
  object-fit:cover;
  transform:translate(-50%,-50%) scale(1.08);
  filter:blur(14px);
  opacity:.78;
  pointer-events:none;
}

/* DARK OVERLAY */
.page-container::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(0,0,0,.42);
  pointer-events:none;
}

/* CENTER CONTENT */
.page-wrap{
  position:relative;
  z-index:2;
  width:100%;
  max-width:720px;
  min-height:100vh;
  min-height:100svh;
  margin:0 auto;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* CONTENT */
.content{
  width:100%;
  padding:20px;
  min-height:auto;
}

/* HEADER */
.page-header{
  text-align:center;
  padding:0;
}

/* TITLE */
.header-title{
  color:#fff;
  margin:0;
  padding:10px;
  font-size:21px;
  font-weight:600;
  line-height:1.4;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}

/* SUBTITLE */
.header-subtitle{
  margin-top:4px;
  color:#fff;
  font-size:15px;
  opacity:.75;
  padding:0 30px;
  line-height:1.5;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}

/* BUTTON AREA */
.user-blocks{
  margin-top:12px;
}

.user-block{
  margin:14px 0;
}

/* BUTTON LINK */
.user-block a{
  display:block;
  color:#000;
  text-decoration:none;
}

/* BUTTON */
.content-btn{
  position:relative;
  display:flex;
  width:100%;
  min-height:60px;
  align-items:center;
  justify-content:center;
  padding:8px;
  margin:14px 0;

  border-radius:36px;
  background:#fff;
  color:#000;

  box-shadow:0 8px 25px rgba(0,0,0,.25);

  transition:
    transform .2s ease,
    opacity .2s ease;
}

/* BUTTON HOVER */
.content-btn:hover{
  transform:translateY(-2px);
  opacity:.95;
}

/* BUTTON PRESS */
.content-btn:active{
  transform:scale(.98);
}

/* BUTTON TEXT */
.text-content{
  width:100%;
  text-align:center;
  margin:12px;
  font-size:18px;
  font-weight:700;
}

/* ANIMATED BORDER */
.animated-border::before,
.animated-border::after{
  content:"";
  position:absolute;
  top:-10px;
  left:-10px;
  right:-10px;
  bottom:-10px;

  border:2px solid rgba(255,255,255,.8);
  border-radius:36px;

  pointer-events:none;
  animation:clippath 3s infinite linear;
}

.animated-border::after{
  animation-delay:-1.5s;
}

@keyframes clippath{

  0%,100%{
    clip-path:inset(0 0 96% 0 round 36px);
  }

  25%{
    clip-path:inset(0 96% 0 0 round 36px);
  }

  50%{
    clip-path:inset(96% 0 0 0 round 36px);
  }

  75%{
    clip-path:inset(0 0 0 96% round 36px);
  }

}

/* FOOTER */
footer{
  position:absolute;
  bottom:8px;
  left:0;
  z-index:2;

  width:100%;
  text-align:center;

  padding:10px;
  color:rgba(255,255,255,.55);
  font-size:11px;
}

/* SMARTPHONE */
@media(max-width:500px){

  .page-container{
    min-height:100svh;
  }

  .page-theme-content{
    width:100vw;
    height:100svh;

    transform:
      translate(-50%,-50%)
      scale(1.12);

    filter:blur(12px);
  }

  .page-wrap{
    min-height:100svh;
    justify-content:center;
  }

  .content{
    padding:20px;
  }

  .header-title{
    font-size:21px;
    margin:0;
    padding:8px 10px;
  }

  .header-subtitle{
    font-size:15px;
    padding:0 20px;
    margin-top:4px;
  }

  .user-block{
    margin:12px 0;
  }

  .content-btn{
    min-height:58px;
    margin:12px 0;
    border-radius:32px;
  }

  .text-content{
    font-size:17px;
    margin:12px;
  }

  footer{
    bottom:4px;
    padding:8px;
  }
}

/* VERY SMALL PHONES */
@media(max-height:650px){

  .header-title{
    font-size:19px;
  }

  .header-subtitle{
    font-size:14px;
  }

  .content-btn{
    min-height:52px;
    margin:9px 0;
  }

  .text-content{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="page-container">

  <!-- BACKGROUND VIDEO -->
  <video
    class="page-theme-content"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <source src="background-video.mp4" type="video/mp4">
  </video>

  <!-- CENTER CONTENT -->
  <div class="page-wrap">

    <div class="content">

      <header class="page-header">

        <div class="header-title">
          Press Continue to watch the video.
        </div>

        <div class="header-subtitle">
          Press Continue to watch the video.
        </div>

      </header>

      <!-- PLAY BUTTON -->
      <div class="user-block">

        <a
          href="#"
          rel="nofollow noopener noreferrer">

          <div class="content-btn">

            <div class="text-content">
              PLAY VIDEO
            </div>

          </div>

        </a>

      </div>

      <!-- ALTERNATIVE BUTTON -->
      <div class="user-block">

        <a
          href="#"
          rel="nofollow noopener noreferrer">

          <div class="content-btn">

            <div class="text-content">
              ALTERNATIVE
            </div>

          </div>

        </a>

      </div>

    </div>

    <footer>
      © 2026 Your Website
    </footer>

  </div>

</div>

</body>
</html>
