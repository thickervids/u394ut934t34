<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your landing page">
<title>I hope you all like it!</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --font-family:'Poppins',Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:var(--font-family);
}

body{
  overflow:hidden;
  background:#111;
}

/* =========================================
   MAIN CONTAINER
   ========================================= */

.page-container{
  position:relative;
  width:100%;
  height:100vh;
  height:100svh;
  overflow:hidden;
  background:#111;
  color:#fff;
}

/* =========================================
   BACKGROUND VIDEO
   ========================================= */

.page-theme-content{
  position:fixed;

  top:50%;
  left:50%;

  z-index:0;

  width:100vw;
  height:100vh;

  object-fit:cover;

  transform:
    translate(-50%,-50%)
    scale(1.08);

  filter:blur(14px);

  opacity:.78;

  pointer-events:none;

  background:#111;
}

/* =========================================
   DARK OVERLAY
   ========================================= */

.page-container::after{
  content:"";

  position:fixed;
  inset:0;

  z-index:1;

  background:rgba(0,0,0,.42);

  pointer-events:none;
}

/* =========================================
   CENTER CONTENT
   ========================================= */

.page-wrap{
  position:relative;

  z-index:2;

  width:100%;
  max-width:720px;

  height:100vh;
  height:100svh;

  margin:0 auto;

  display:flex;

  align-items:center;
  justify-content:center;
}

/* =========================================
   CONTENT
   ========================================= */

.content{
  width:100%;
  padding:20px;
}

/* =========================================
   HEADER
   ========================================= */

.page-header{
  text-align:center;
  margin-bottom:14px;
}

.header-subtitle{
  margin:0;

  padding:0 20px;

  color:#fff;

  font-size:16px;
  font-weight:500;

  line-height:1.5;

  opacity:.88;

  text-shadow:
    0 2px 8px rgba(0,0,0,.5);
}

/* =========================================
   BUTTON
   ========================================= */

.user-block{
  width:100%;
  margin:12px 0;
}

.user-block a{
  display:block;

  width:100%;

  color:#000;

  text-decoration:none;
}

.content-btn{
  position:relative;

  display:flex;

  width:100%;

  min-height:58px;

  align-items:center;
  justify-content:center;

  padding:8px;

  margin:12px 0;

  border-radius:32px;

  background:#fff;

  color:#000;

  box-shadow:
    0 8px 25px rgba(0,0,0,.28);

  transition:
    transform .2s ease,
    opacity .2s ease;
}

.content-btn:hover{
  transform:translateY(-2px);
  opacity:.95;
}

.content-btn:active{
  transform:scale(.98);
}

.text-content{
  width:100%;

  margin:12px;

  text-align:center;

  font-size:17px;

  font-weight:700;
}

/* =========================================
   FOOTER
   ========================================= */

footer{
  position:absolute;

  left:0;
  bottom:5px;

  z-index:2;

  width:100%;

  padding:8px;

  text-align:center;

  color:rgba(255,255,255,.55);

  font-size:11px;
}

/* =========================================
   SMARTPHONE PORTRAIT
   ========================================= */

@media(max-width:500px){

  .page-container{
    width:100vw;
    height:100svh;
  }

  /*
    Video memenuhi layar portrait.
    object-fit:cover membuat video
    mengikuti ukuran layar HP.
  */

  .page-theme-content{
    position:fixed;

    top:50%;
    left:50%;

    width:100vw;
    height:100svh;

    object-fit:cover;

    transform:
      translate(-50%,-50%);

    filter:blur(12px);

    opacity:.78;
  }

  .page-wrap{
    width:100vw;
    height:100svh;

    align-items:center;
    justify-content:center;
  }

  .content{
    width:100%;
    padding:20px;
  }

  .header-subtitle{
    font-size:15px;
    padding:0 15px;
  }

  .content-btn{
    min-height:58px;

    margin:12px 0;

    border-radius:32px;
  }

  .text-content{
    font-size:17px;
  }
}

/* =========================================
   VERY SMALL PHONE
   ========================================= */

@media(max-width:500px) and (max-height:650px){

  .header-subtitle{
    font-size:14px;
  }

  .page-header{
    margin-bottom:8px;
  }

  .user-block{
    margin:8px 0;
  }

  .content-btn{
    min-height:52px;
    margin:9px 0;
  }

  .text-content{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="page-container">

  <!-- =====================================
       BACKGROUND VIDEO
       ===================================== -->

  <video
    id="backgroundVideo"
    class="page-theme-content"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="metadata">

    <source
      src="https://cdn.videy.co/8X1yueep1.mp4"
      type="video/mp4">

  </video>


  <!-- =====================================
       CENTER CONTENT
       ===================================== -->

  <div class="page-wrap">

    <div class="content">

      <header class="page-header">

        <div class="header-subtitle">
          Press Continue to watch the video.
        </div>

      </header>


      <!-- PLAY VIDEO -->

      <div class="user-block">

        <a
          href="#"
          rel="nofollow noopener noreferrer">

          <div class="content-btn">

            <div class="text-content">
              PLAY VIDEO
            </div>

          </div>

        </a>

      </div>


      <!-- ALTERNATIVE -->

      <div class="user-block">

        <a
          href="#"
          rel="nofollow noopener noreferrer">

          <div class="content-btn">

            <div class="text-content">
              ALTERNATIVE
            </div>

          </div>

        </a>

      </div>

    </div>

  </div>


  <!-- FOOTER -->

  <footer>
    © 2026 Your Website
  </footer>

</div>


<script>

/* =========================================
   VIDEO SETUP
   ========================================= */

const video =
  document.getElementById("backgroundVideo");


/* Pastikan muted untuk autoplay */

video.muted = true;

video.defaultMuted = true;

video.setAttribute("muted", "");

video.setAttribute("playsinline", "");

video.setAttribute(
  "webkit-playsinline",
  ""
);


/* =========================================
   START VIDEO
   ========================================= */

function startVideo(){

  video.play().catch(function(error){

    console.log(
      "Autoplay blocked:",
      error
    );

  });

}


/* =========================================
   WAIT FOR VIDEO
   ========================================= */

video.addEventListener(
  "loadeddata",
  startVideo,
  {once:true}
);

video.addEventListener(
  "canplay",
  startVideo,
  {once:true}
);


/* =========================================
   IF VIDEO IS ALREADY READY
   ========================================= */

if(video.readyState >= 3){

  startVideo();

}


/* =========================================
   VIDEO ERROR
   ========================================= */

video.addEventListener(
  "error",
  function(){

    console.log(
      "Background video gagal dimuat."
    );

  }
);

</script>

</body>
</html>
